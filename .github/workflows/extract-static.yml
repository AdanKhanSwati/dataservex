name: Extract static DataServeX site

on:
  push:
    branches: [main]
    paths:
      - 'payload.*'
      - '.github/workflows/extract-static.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract static website into repository root
        shell: bash
        run: |
          if ! ls payload.* >/dev/null 2>&1; then
            echo "Static payload already extracted."
            exit 0
          fi
          cat payload.* | base64 -d > site.zip
          rm -rf site
          mkdir site
          unzip -q site.zip -d site
          test -f site/index.html
          rm -f payload.* package.json vercel.json build.mjs site.zip
          cp -a site/. .
          rm -rf site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish static DataServeX HTML files"
          git push